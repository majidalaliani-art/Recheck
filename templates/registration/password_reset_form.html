{% extends 'registration/auth.html' %}
{% load static %}

{% block auth_content %}
<div class="auth-login auth-main-content">
  <div class="container auth-login-container">
      <h3 class="text-center mb-3">إعادة تعيين كلمة السر</h3>
      <p class="text-center text-white-50 mb-4 fs-7">أدخل بريدك الإلكتروني وسيتم إرسال رابط لإعادة تعيين كلمة السر.</p>

      <form method="POST">
          {% csrf_token %}

          {% if form.errors %}
              <div class="alert alert-danger py-2 text-center" role="alert">
                  الرجاء التأكد من صحة البريد الإلكتروني.
              </div>
          {% endif %}

          <div class="mb-3">
              <label for="id_email">البريد الإلكتروني</label>
              <input type="email" name="email" id="id_email" class="form-control" placeholder="example@domain.com" required>
          </div>

          <div class="d-grid gap-2 mt-4">
              <button type="submit" class="btn btn-primary">إرسال رابط التعيين</button>
          </div>
      </form>

      <div class="text-center mt-3">
          <a href="{% url 'Base:login' %}" class="text-decoration-none">← العودة لتسجيل الدخول</a>
      </div>
  </div>
</div>
{% endblock %}
