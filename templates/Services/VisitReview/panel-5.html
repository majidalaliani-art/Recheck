<div class="room-accordion-list">
  {% for room in Visit.areas.all %}
  <div id="room-card-{{ room.id }}" class="room-card">
    <button class="room-card__header" type="button" data-bs-toggle="collapse" data-bs-target="#room-{{ room.id }}" aria-expanded="false">
      <div class="room-card__title">
        <span class="room-card__bullet">◆</span>
        <span>{{ room.name|default:room.get_key_display }}</span>
      </div>
      <div class="room-card__icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
    </button>

    <!-- محتوى الكارت عند الفتح -->
    <div id="room-{{ room.id }}" class="collapse room-card__body room-gallery">
      {% for img in room.images.all %}
        <a href="{{ img.image.url }}" data-fancybox="{{ room.id }}-{{room.key}}" target="_blank" class="room-gallery__item">
          <img src="{{ img.image.url }}" alt="{{ room.name|default:room.get_key_display }}" loading="lazy" />
        </a>
      {% endfor %}
    </div>

  </div>
  {% endfor %}
</div>
<br>


<div class="recommendations-section">
  <p class="alert">التوصيات العامة</p>
  <br>
  <!-- قائمة التوصيات -->
  <div class="recommendations-list">
    {% for rec in Visit.recommendations.all %}
      <div class="recommendation-card">
        <span class="recommendation-card__number">{{ rec.number }}</span>
        <p class="recommendation-card__text">{{ rec.text }}</p>
      </div>
    {% endfor %}
  </div>
</div>
