    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<body>


    <header id="header">
            {% if phone %}
                <a id="login">
                    <i class="fa-solid fa-user"></i>
                    <span class="login">{{phone}}</span>
                </a>
            {%  else %}
                <a id="login"  href="{% url 'login' %}">
                    <i class="fa-solid fa-user-plus"></i>
                    <span class="login">Login</span>
                </a>
            {% endif %}



    </header>

    <section class="cards" id="services">

        <div class="col-md-6 col-lg-3">
            <a href="{% url 'property' 'villa' %}" class="selection-link">
                <div class="card h-100 selection-card">
                    <div class="card-body p-5">
                        <i class="fas fa-home fa-4x mb-4"></i>
                        <h3 class="fw-bold">فيلا</h3>
                    </div>
                </div>
            </a>
        </div>



        <div class="col-md-6 col-lg-3">
            <a href="/apartment/" class="selection-link" onclick="sessionStorage.setItem('selected_type', 'شقة')">
                <div class="card h-100 selection-card">
                    <div class="card-body p-5">
                        <i class="fas fa-building fa-4x mb-4"></i>
                        <h3 class="fw-bold">شقة</h3>
                    </div>
                </div>
            </a>
        </div>


    </section>


<form method="post">
    {% csrf_token %}
    <div class="form-group">
        <label for="id_name">الاسم:</label>
        {{ form.name }}
    </div>
    <div class="form-group">
        <label for="id_phone">رقم الجوال:</label>
        {{ form.phone }}
    </div>
    <div class="form-group">
        <label for="id_summary">ملخص الاستشارة:</label>
        {{ form.summary }}
    </div>



    <div class="form-group">
        <label for="id_day">اليوم:</label>
        {{ form.day }}
    </div>


    <div class="form-group">
        <label>السعر:</label>
        <span id="price-display" class="form-control-plaintext"></span>
    </div>


    <div class="form-group">
        <label>الوقت:</label>
        <span id="time-display" class="form-control-plaintext"></span>
    </div>






    <button type="submit" name='consultation' value='consultation' class="btn btn-primary">إرسال الطلب</button>
</form>







  </div>

</section>







</body>
</html>


{{ days_data|json_script:"days-data" }}

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const daysData = JSON.parse(document.getElementById('days-data').textContent);
        const daySelect = document.querySelector('select[name="day"]');
        const priceDisplay = document.getElementById('price-display');
        const timeDisplay = document.getElementById('time-display');

        function updateDisplay() {
            const selectedId = daySelect.value;
            if (selectedId && daysData[selectedId]) {
                const info = daysData[selectedId];
                priceDisplay.innerText = info.price + ' ريال';
                timeDisplay.innerText = info.start_time + ' - ' + info.end_time;
            } else {
                priceDisplay.innerText = '';
                timeDisplay.innerText = '';
            }
        }

        daySelect.addEventListener('change', updateDisplay);
        updateDisplay();
    });
</script>
