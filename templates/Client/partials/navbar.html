{% load static %}
<div class="tk__navbar__full">
  <div class="tk__logo">
    <a href="/" class="recheck-brand-header">
      <img src="{% static 'images/recheck_logo.png' %}" class="nav-brand-badge" alt="ريتشيك" />
    </a>
  </div>

  <div class="nav-menu-container">

    <ul class="tk__nav__items">
      <li><a href="#services">الخدمات</a></li>
      <li><a href="#inspection">الفحص</a></li>
      <li><a href="#report">التقـــرير</a></li>
      <li><a href="#coverage">التغطية</a></li>
      <li><a href="#contact">اتصل بنا</a></li>
    </ul>

    <div class="auth-action">
      {% if request.session.user %}
        <a href="{% url 'Base:logout' %}?app={{ request.resolver_match.app_name }}&next={{ request.path }}" class="btn-auth-pill btn-logout" title="تسجيل الخروج">
          <span class="auth-text">تسجيل الخروج</span>
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </a>
      {% else %}
        <a href="{% url 'Client:login' %}?app={{ request.resolver_match.app_name }}&next={{ request.path }}" class="btn-auth-pill btn-login" title="تسجيل الدخول">
          <span class="auth-text">تسجيل الدخول</span>
          <i class="fa-solid fa-arrow-right-to-bracket"></i>
        </a>
      {% endif %}
    </div>

  </div>

  <div class="menu-toggle">
    <span></span>
    <span></span>
    <span></span>
  </div>
</div>
