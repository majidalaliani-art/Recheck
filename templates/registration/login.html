{% extends 'registration/auth.html' %}
{% load static %}

{% block auth_content %}

<div class="auth-login auth-main-content">
  <div class="container auth-login-container">
      <h3 class="text-center mb-4">تسجيل الدخول</h3>

      <form method="POST">
          {% csrf_token %}

          {% if form.errors %}
              <div class="alert alert-danger py-2 text-center" role="alert">
                  خطأ في اسم المستخدم أو كلمة المرور.
              </div>
          {% endif %}

          <!-- حقل اسم المستخدم -->
          <div class="mb-3">
              <label for="id_username">اسم المستخدم</label>
              <input type="text" name="username" id="id_username" class="form-control" placeholder="أدخل اسم المستخدم" required>
          </div>

          <!-- حقل كلمة المرور مع أيقونة Font Awesome -->
          <div class="mb-3">
              <label for="id_password">كلمة المرور</label>
              <div class="password-wrapper">
                  <input type="password" name="password" id="id_password" class="form-control" placeholder="أدخل كلمة المرور" required>
                  <button type="button" class="toggle-password-btn" id="togglePasswordBtn">
                    <i class="fa-regular fa-eye-slash" id="toggleIcon"></i>
                  </button>
              </div>
          </div>


          <div class="d-grid gap-2 mt-4">
              <button type="submit" class="btn btn-primary">تسجيل الدخول</button>
          </div>
      </form>

      <div class="text-center mt-3">
          <a href="{% url 'Base:password_reset' %}" class="text-decoration-none">نسيت كلمة السر؟</a>
      </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const passwordInput = document.getElementById('id_password');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const toggleIcon = toggleBtn ? toggleBtn.querySelector('i') : null;

    if (passwordInput && toggleBtn) {
      toggleBtn.addEventListener('click', function () {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        toggleBtn.style.opacity = isPassword ? '1' : '0.5';

        if (toggleIcon) {
          if (isPassword) {
            toggleIcon.className = 'fa-regular fa-eye';
          } else {
            toggleIcon.className = 'fa-regular fa-eye-slash';
          }
        }
      });
    }
  });
</script>


{% endblock %}
