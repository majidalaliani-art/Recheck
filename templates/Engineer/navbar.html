{% load static %}

<div class="staff-navigation">
  <div class="user-identity">
    <div class="avatar-box">
      <img src="{{ engineer.avatar }}" class="avatar-img" />
    </div>
    <div class="info-box">
      <h2 class="role-name">{{ engineer.first_name|default:engineer.username }}</h2>

      <span class="role-tag">{% if is_engineer %}مهندس معتمد{% else %}مسؤول النظام{% endif %}</span>
    </div>
  </div>

  <ul>
    <li class="{% if request.resolver_match.url_name == 'home_url' %}hovered{% endif %}">
      <a href="#">
        <span class="icon">
          <i class="fa-solid fa-chart-bar"></i>
          <!-- تعديل الأيقونة هنا -->
        </span>
        <span class="title">الرئيسية</span>
      </a>
    </li>

    <li>
      <a href="#">
        <span class="icon">
          <i class="fa-brands fa-opencart"></i>
          <!-- تعديل الأيقونة هنا -->
        </span>
        <span class="title">طلباتي</span>
      </a>
    </li>

    <li class="{% if request.resolver_match.url_name == 'wallet_url' %}hovered{% endif %}">
      <a href="#">
        <span class="icon">
          <i class="fa-regular fa-folder"></i>
          <!-- تعديل الأيقونة هنا -->
        </span>
        <span class="title">رصيدي</span>
      </a>
    </li>

    <li class="{% if request.resolver_match.url_name == 'staff_data' %}hovered{% endif %}">
      <a href="{% url 'Staff:staff_data' %}">

        <span class="icon">
          <i class="fa-solid fa-wallet"></i>
          <!-- تعديل الأيقونة هنا -->
        </span>
        <span class="title">بياناتي</span>
      </a>
    </li>

    <li class="{% if request.resolver_match.url_name == 'settings' %}hovered{% endif %}">
      <a href="{% url 'Staff:settings' %}">
        <span class="icon">
          <i class="fa-solid fa-sliders"></i>
        </span>
        <span class="title">إعدادات</span>
      </a>
    </li>
  </ul>

  <!-- تعديل فورم تسجيل الخروج ليتوافق مع حماية جانجو (POST) -->
  <div class="logout">
    <form action="{% url 'Base:logout' %}" method="post" class="logout-btn">
      {% csrf_token %}
      <!-- التعديل هنا بس: شلنا التكرار عشان يشتغل الفورم -->
      <button class="btn btn-danger" type="submit">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>تسجيل الخروج</span>
      </button>
    </form>
  </div>
</div>
